<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Subtitles store screenshot</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #090a0c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .browser { height: 64px; display: flex; align-items: center; gap: 13px; padding: 0 18px; background: #202124; border-bottom: 1px solid #34363a; }
      .traffic { display: flex; gap: 7px; margin-right: 5px; }
      .traffic i { width: 10px; height: 10px; border-radius: 50%; background: #5d6066; }
      .address { height: 36px; flex: 1; display: flex; align-items: center; padding: 0 16px; border-radius: 18px; background: #303134; color: #bdc1c6; font-size: 13px; }
      .browser img { width: 32px; height: 32px; }
      .workspace { height: calc(100% - 64px); display: grid; grid-template-columns: minmax(0, 1fr) 405px; }
      .video { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 32%, #273a43 0, #172127 28%, #090b0d 70%); }
      .stage { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; gap: 190px; padding-bottom: 115px; }
      .person { position: relative; width: 175px; height: 290px; border-radius: 90px 90px 22px 22px; background: linear-gradient(145deg, #25333a, #0e1316); box-shadow: 0 25px 90px #000; }
      .person::before { content: ""; position: absolute; width: 105px; height: 105px; left: 35px; top: -78px; border-radius: 50%; background: linear-gradient(145deg, #344951, #12191d); }
      .person::after { content: ""; position: absolute; width: 8px; height: 105px; right: -55px; top: 18px; border-radius: 6px; background: #53656c; box-shadow: 0 -45px 0 12px #111719; transform: rotate(-8deg); }
      .person.alt { transform: scaleX(-1); background: linear-gradient(145deg, #2d2b39, #121117); }
      .halo { position: absolute; width: 560px; height: 560px; top: -300px; left: 50%; transform: translateX(-50%); border-radius: 50%; border: 1px solid rgba(127,227,255,.16); box-shadow: 0 0 100px rgba(127,227,255,.08); }
      .program { position: absolute; left: 34px; top: 30px; color: #d9dde0; }
      .program strong { display: block; font-size: 19px; font-weight: 600; }
      .program span { color: #7e878d; font-size: 12px; }
      .caption { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); max-width: 720px; padding: 10px 18px; border-radius: 5px; background: rgba(0,0,0,.78); color: #fff; font-size: 25px; line-height: 1.35; text-align: center; white-space: nowrap; }
      .caption .sub { display: none; margin-top: 4px; font-size: 18px; opacity: .62; }
      body.translated .caption .sub { display: block; }
      .wave { position: absolute; left: 30px; right: 30px; bottom: 20px; height: 2px; background: linear-gradient(90deg, transparent, #19bfea, #efc31c, #65dc79, transparent); opacity: .65; }
      iframe { width: 405px; height: 100%; border: 0; border-left: 1px solid #2a2a2d; background: #000; }
    </style>
  </head>
  <body>
    <div class="browser">
      <div class="traffic"><i></i><i></i><i></i></div>
      <div class="address">media.example / product conversation</div>
      <img src="/icons/icon-32.png" alt="" />
    </div>
    <main class="workspace">
      <section class="video">
        <div class="halo"></div>
        <div class="program"><strong>The Interview</strong><span>Product conversation · live</span></div>
        <div class="stage"><div class="person"></div><div class="person alt"></div></div>
        <div class="caption">
          Every change touched three services at once.
          <div class="sub">Каждое изменение задевало три сервиса сразу.</div>
        </div>
        <div class="wave"></div>
      </section>
      <iframe id="panel" src="/preview.html" title="Tab Subtitles side panel"></iframe>
    </main>
    <script>
      // ?settings shows the settings sheet, ?scene=translated the translated
      // transcript; without either, the panel keeps its own live scene.
      const panel = document.getElementById('panel');
      panel.addEventListener('load', () => {
        const params = new URLSearchParams(location.search);
        const settings = params.has('settings');
        const scene = params.get('scene');
        if (!settings && !scene) return;
        if (scene === 'translated') document.body.classList.add('translated');
        setTimeout(() => {
          panel.contentWindow?.__scene?.(settings ? 'settings' : scene);
          if (settings) {
            setTimeout(() => panel.contentDocument?.querySelector('button[aria-label="settings"]')?.click(), 150);
          }
        }, 500);
      });
    </script>
  </body>
</html>
